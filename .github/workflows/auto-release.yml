name: Auto Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      # Required for commit, tag, and release creation
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read current version
        id: version
        run: |
          CURRENT=$(grep -oP "(?<=__version__ = ')[^']+" core/__init__.py)

          if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: '$CURRENT'. Expected semver (e.g. 1.2.3)."
            exit 1
          fi

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump version in core/__init__.py
        run: |
          sed -i "s/__version__ = '.*'/__version__ = '${{ steps.version.outputs.new }}'/" core/__init__.py

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add core/__init__.py
          git commit -m "Bump version to ${{ steps.version.outputs.new }} [skip ci]"
          git push

      - name: Create tag
        run: |
          git tag "v${{ steps.version.outputs.new }}"
          git push origin "v${{ steps.version.outputs.new }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.new }}"
          name: "v${{ steps.version.outputs.new }}"
          generate_release_notes: true

      # The in-app auto-updater downloads the release source zipball and REFUSES
      # to apply it unless its SHA-256 matches a value published in this
      # SHA256SUMS release asset (integrity/anti-tamper). We therefore hash the
      # exact same zipball GitHub serves for this tag and upload the digest.
      # NOTE: GitHub does not formally guarantee that on-the-fly source zipballs
      # are byte-stable over time; if a future download differs, the updater
      # fails safe (refuses, user updates manually). For a fully deterministic
      # guarantee, switch to hashing a self-built archive uploaded as an asset
      # and point the updater at that asset instead of the zipball.
      - name: Publish SHA256SUMS for verified auto-update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.new }}"
          ZIP_URL="https://api.github.com/repos/${{ github.repository }}/zipball/${TAG}"
          curl -fsSL --retry 5 --retry-delay 3 \
               -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               -o source.zip "$ZIP_URL"
          HASH=$(sha256sum source.zip | cut -d' ' -f1)
          printf '%s  astromanager-%s.zip\n' "$HASH" "$TAG" > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber --repo "${{ github.repository }}"
